; A tiknix app's configuration. Copy to conf/config.ini (gitignored — it holds secrets) and edit.
; Everything here is read by the tiknix runtime (vendor/tiknix/runtime).

[app]
name = "My App"
environment = "development" ; production, development, testing
debug = true
build_mode = true ; Keep on: a route with no permission row becomes ADMIN-only on first use (off, it would be PUBLIC). Seed real rows with PermissionCache::seedRule()
session_name = "APP_SESSION"
session_lifetime = 86400 ; 24 hours
baseurl = "http://localhost:8000"
timezone = "UTC"
demo_mode = false ; ON: comms builds threads in-app and never calls Mailgun (offline demos/tests)

[legal]
; Who /terms and /privacy speak for. Without operator and email those pages say they are not
; published yet. A domain with its own conf/hosts/<host>.ini sets its own.
; name = "My App"                          ; default: [app] name
; operator = "My Company LLC"              ; the person or company that runs the site
; email = "legal@example.com"
; governing_law = "the State of North Carolina"   ; optional
; updated = "September 30, 2026"                  ; optional "Last updated" line

[database]
; SQLite needs nothing else. For MySQL/Postgres: type, host, port, name, user, pass, charset.
type = "sqlite"
path = "database/app.db"

[logging]
level = "DEBUG" ; DEBUG, INFO, WARNING, ERROR, CRITICAL
file = "log/app.log"
max_files = 30 ; Keep 30 days of logs

; Per-query cache tracing (hit/miss/invalidate). OFF by default: it accounted for 56% of
; a day's log lines while the cache was working correctly, which buries the errors that
; matter. Turn on only while debugging the query cache.
query_cache_debug = false

[cors]
enabled = false
origin = "*"
methods = "GET, POST, PUT, DELETE, OPTIONS"
headers = "Content-Type, Authorization"
credentials = false

[security]
app_key = "" ; generate with: php -r "echo bin2hex(random_bytes(32));"
; CSRF protection has no setting: it is always on (lib/SimpleCsrf.php), and the form field is
; _csrf_token. Two keys used to sit here — csrf_enabled and csrf_token_name — and nothing
; ever read either, so "csrf_enabled = false" described a state the app was never in.
password_min_length = 6
password_require_special = false
password_require_numbers = false
password_require_uppercase = false
max_login_attempts = 5
lockout_duration = 900 ; 15 minutes in seconds

; Two-factor authentication (TOTP). Default: on and OPTIONAL — admins (level <= 50) are
; offered it at login and may "Skip for now"; whoever enrols verifies every login.
;   two_factor_enabled = false  -> disable 2FA entirely (dev convenience)
;   two_factor_enforce = true   -> REQUIRED: admins must enrol before continuing
two_factor_enabled = true
two_factor_enforce = false

[uploads]
enabled = true
max_size = 5242880 ; 5MB in bytes
upload_path = "uploads/"
allowed_types = "image/jpeg,image/png,image/gif,application/pdf"
create_thumbnails = false
thumbnail_width = 200
thumbnail_height = 200

[cache]
enabled = false
driver = "file" ; file, redis, memcached
ttl = 3600 ; 1 hour
path = "cache/"

; Redis Settings
redis_host = "127.0.0.1"
redis_port = 6379
redis_password = ""
redis_database = 0

; --- RedBean query cache -------------------------------------------------------
query_cache = true      ; cache SELECTs through app\CachedDatabaseAdapter
query_cache_ttl = 60    ; seconds a cached result may live

; Where the per-table generation counters live. Cached ROWS always stay in APCu; this is
; only the tiny "has this table changed" marker.
;   apcu   - one process family only. A CLI writer CANNOT invalidate a web reader: php-fpm
;            and each CLI invocation hold separate APCu segments. Safe, just blind across
;            processes, so anything a CLI script writes and the web reads may serve a
;            result up to query_cache_ttl old.
;   valkey - shared by every process on the box (valkey/redis via the php redis extension),
;            so orchestrators, cron and pipelines invalidate what the web cached.
; Named-but-unreachable DISABLES caching and logs at ERROR; it never falls back to apcu,
; which would restore the blind spot silently.
version_store = "apcu"  ; apcu | valkey

[api]
enabled = false
rate_limit = true
rate_limit_requests = 100
rate_limit_window = 3600 ; 1 hour
require_auth = true
api_key_header = "X-API-Key"

[social]
; Google OAuth 2.0 Settings
; Create credentials at: https://console.cloud.google.com/apis/credentials
; Add authorized redirect URI: https://yourapp.com/auth/googlecallback
google_client_id = ""
google_client_secret = ""
google_redirect_uri = "http://localhost:8000/auth/googlecallback"

; Facebook OAuth Settings (not yet implemented)
facebook_app_id = ""
facebook_app_secret = ""
facebook_redirect_uri = ""

; GitHub OAuth Settings (not yet implemented)
github_client_id = ""
github_client_secret = ""
github_redirect_uri = ""

[features]
; Feature flags
; registration_enabled is NOT set here — public self-registration is an admin SETTING
; stored in the database (toggle at /admin/settings), so each instance can flip it from
; the UI without editing this file. Kept out on purpose to avoid two conflicting sources.
email_verification = false
two_factor_auth = false
remember_me = true
social_login = false
api_access = false
file_uploads = true

[integrations]
; Inbound messaging from connected platforms (Telegram, Slack, Discord).
;
; How many distinct external handles ONE connection may accumulate. A public
; group is joinable by anyone, so "people who can post in a channel you
; connected" is not a bounded set. Rows are tiny — millions would be needed to
; trouble a disk — but a table that grows from the outside should have a visible
; number on it rather than one discovered during an incident. Reaching the cap
; is logged at ERROR; existing handles keep working.
max_identities_per_connection = 5000

; Inbound webhook deliveries accepted per connection per minute. Sessionless
; (APCu-backed), because a webhook carries no cookie. If APCu is unavailable the
; limiter fails OPEN and says so once — a limiter that became a brick wall would
; be a worse outage than the abuse it guards against.
inbound_per_minute = 120

; Days an UNLINKED handle that never posted may sit idle before
; Model_Externalidentity::purgeIdle() may remove it. Linked handles are never
; purged: they are part of an account's history.
purge_idle_days = 90

[mqtt]
; Live delivery — "there is something for you, come and get it". The broker is
; installed by capricorn (configure/install-mosquitto.sh); capricorn/docs/MQTT.md
; covers the listeners, the topic ACL and the account model.
;
; enabled = false means the UI falls back to its polling interval and nothing
; breaks. MQTT only ever makes delivery faster; polling remains the guarantee.
; Leave it off until the broker is actually reachable — an enabled-but-dead
; broker means every signed-in browser retries a WebSocket that cannot connect.
enabled = false

; Server-side publishing. These are the tnx-pub credentials the capricorn
; installer writes to the publisher ini under the mosquitto config directory.
host = "127.0.0.1"
port = 1883
username = "tnx-pub"
password = ""

; Where browsers connect. Same origin — nginx proxies this path to the broker's
; websockets listener on 9001, so it inherits the page's TLS and certificate.
ws_path = "/mqtt"

; Mints each member's broker password: HMAC(member id, this secret). Nothing is
; stored, so this and the broker's password file are two derivations of one
; secret rather than two copies of a value — and rotating this invalidates every
; credential at once. scripts/mqtt-sync-accounts.php builds the file from the
; same derivation, so the two cannot drift.
; openssl rand -hex 32
secret = ""

[pipeline]
; Shared bearer secret for POST /pipeline/trigger/<slug> (cron/webhook fires).
; The fake-cron tick reads this per-instance. openssl rand -hex 32
trigger_secret = ""

[forge]
; The VoidLux forge (see conf/config.ini of a running install): where games publish, how agents sign in, how soaks run.
domain = "example.com"
publish_root = "/var/www/html/default"
agent_login = "host"
; jail = 1 runs every agent inside bubblewrap (studio/jail.sh): the OS read-only, the game folder read-write, nothing else of
; this machine visible, and inside that boundary the agent runs without permission prompts. 0 = plain folder with a Bash allowlist.
jail = 1 ; or app: the credential set on /agents
model = ""
max_turns = 60
; the folder of the node the agents and their plugins' MCP servers run on, when the system node is too old (mojulo needs 22.14+). Empty = the system node.
node_bin = ""
playwright_root = "/home/ubuntu"
chrome = "/usr/bin/google-chrome"
soak_url = "https://example.com"
cdp_url = "http://127.0.0.1:9222"
; server_chrome = 1 lets the server launch its own headless Chrome for a playtest when no browser answers. OFF: on this
; machine it brought the box to its knees. Playtests run in a producer's open browser (the game page) instead.
server_chrome = 0
; how long a playtest waits for someone's browser to pick it up before giving up (seconds)
browser_soak_wait = 60 ; a producer's Chrome tunnelled in (remote debugging); the server's Chrome when nothing answers
