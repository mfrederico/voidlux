; This app's agents: the engines its builder tasks (clitool --agent-task) and pipeline agent
; steps run. Copy to conf/aibuilder.ini. Credentials are NOT here — the app's own chain supplies
; them: a Claude login in .aibuilder/state/claude, else secure/anthropic.key.enc, else an
; 'anthropic' connection (Connections).

[engine]
default = claude

[engine.claude]
label = Claude Code
transport = cli-headless
command = claude
cli_flavor = claude
headless_ready = true
planner_model = claude-opus-5-5
worker_model = sonnet
auditor_model = sonnet
resolver_model = claude-opus-5-5
